[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "future-airborne-network-architecture-study"
version = "0.1.0"
description = "Estudio conceptual y simulador ligero de arquitecturas futuras de red de misión aerotransportada."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Juan Carlos Albert Fillol" }]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "pydantic>=2.7.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "httpx>=0.27.0"]

[project.scripts]
airborne-study = "future_airborne_network_study.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
